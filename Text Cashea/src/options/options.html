<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Cashea</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="options.css">
</head>
<body>
  <header>
    <div class="logo"><span class="logo-dot"></span>Text Cashea</div>
    <div class="header-sep"></div>
    <div class="header-label">Snippets locales</div>
  </header>
  <div class="layout">
    <nav id="sidebar" class="sidebar">
      <button id="new-folder-btn" class="nav-action">+ Nueva carpeta</button>
      <div id="folder-list" class="folder-list"></div>
    </nav>
    <main class="main">
      <div class="toolbar">
        <div class="toolbar-title" id="toolbar-title">General</div>
        <input id="search-input" class="search-box" type="text" placeholder="Buscar por atajo o texto...">
        <button id="new-snippet-btn" class="btn-primary">+ Nuevo snippet</button>
      </div>
      <div id="snippet-list" class="snippet-list"></div>
    </main>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
