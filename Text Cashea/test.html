<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Test Text Cashea</title>
<style>
  body { font-family: sans-serif; padding: 40px; }
  textarea, div[contenteditable] { display: block; width: 500px; height: 150px; font-size: 16px; margin-bottom: 30px; padding: 10px; border: 2px solid #333; }
</style>
</head>
<body>
  <h3>Textarea normal</h3>
  <textarea placeholder="Escribí /test acá"></textarea>

  <h3>Campo contenteditable</h3>
  <div contenteditable="true">Escribí /test acá</div>
</body>
</html>
